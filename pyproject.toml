[project]
name = "pitch-compare"
version = "0.1.0"
description = "Comparação de algoritmos de detecção de pitch (TCC PUCRS 2026)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "librosa>=0.10",
    "mir_eval>=0.7",
    "soundfile>=0.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pitch_compare*"]
